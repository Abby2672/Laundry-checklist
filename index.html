<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laundry Checklist</title>
<style>
    body {
        font-family: Arial, sans-serif;
        padding: 20px;
        background: #f4f6f8;
    }
    h2 {
        text-align: center;
    }
    table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        border-radius: 10px;
        overflow: hidden;
    }
    th, td {
        padding: 12px;
        text-align: center;
        border-bottom: 1px solid #ddd;
    }
    th {
        background: #007bff;
        color: white;
    }
    input {
        width: 90%;
        padding: 5px;
    }
    button {
        margin-top: 15px;
        padding: 10px;
        width: 100%;
        border: none;
        background: #28a745;
        color: white;
        font-size: 16px;
        border-radius: 5px;
    }
</style>
</head>
<body>

<h2>Checklist Laundry</h2>

<table id="laundryTable">
    <thead>
        <tr>
            <th>No</th>
            <th>Pakaian</th>
            <th>Jumlah</th>
            <th>Check</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>1</td>
            <td><input type="text" placeholder="Nama pakaian"></td>
            <td><input type="number" min="1" value="1"></td>
            <td><input type="checkbox"></td>
        </tr>
    </tbody>
</table>

<button onclick="tambahBaris()">Tambah Baris</button>

<script>
function tambahBaris() {
    let table = document.getElementById("laundryTable").getElementsByTagName('tbody')[0];
    let rowCount = table.rows.length;
    let row = table.insertRow();

    row.innerHTML = `
        <td>${rowCount + 1}</td>
        <td><input type="text" placeholder="Nama pakaian"></td>
        <td><input type="number" min="1" value="1"></td>
        <td><input type="checkbox"></td>
    `;
}
</script>

</body>
</html>
