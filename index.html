<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laundry Checklist</title>

<style>
body {
    font-family: Arial;
    background: #f4f6f8;
    padding: 15px;
}
h2 { text-align:center; }

table {
    width: 100%;
    border-collapse: collapse;
    background: white;
}
th, td {
    padding: 10px;
    border: 1px solid #ddd;
    text-align: center;
}
th { background: #007bff; color: white; }

button {
    margin: 5px;
    padding: 10px;
    border: none;
    color: white;
    border-radius: 5px;
    cursor: pointer;
}
.add { background: #28a745; }
.delete { background: #dc3545; }
.deleteSel { background: #ff9800; }

input { width: 90%; }
</style>
</head>

<body>

<h2>Checklist Laundry</h2>

<table id="table">
<thead>
<tr>
<th>No</th>
<th>Tanggal</th>
<th>Pakaian</th>
<th>Jumlah</th>
<th>Check</th>
</tr>
</thead>
<tbody></tbody>
</table>

<div style="text-align:center;">
<button class="add" onclick="tambah()">Tambah Baris</button>
<button class="deleteSel" onclick="hapusSelected()">Hapus Terpilih</button>
<button class="delete" onclick="hapusSemua()">Hapus Semua</button>
</div>

<h3>Total Pakaian: <span id="total">0</span></h3>

<script>
let data = JSON.parse(localStorage.getItem("laundry")) || [];

function render() {
    let tbody = document.querySelector("tbody");
    tbody.innerHTML = "";
    let total = 0;

    data.forEach((item, i) => {
        total += Number(item.jumlah);

        tbody.innerHTML += `
        <tr>
            <td>${i+1}</td>
            <td><input type="date" value="${item.tanggal}" onchange="update(${i}, 'tanggal', this.value)"></td>
            <td><input type="text" value="${item.nama}" onchange="update(${i}, 'nama', this.value)"></td>
            <td><input type="number" value="${item.jumlah}" onchange="update(${i}, 'jumlah', this.value)"></td>
            <td><input type="checkbox" ${item.check ? "checked":""} onchange="update(${i}, 'check', this.checked)"></td>
        </tr>`;
    });

    document.getElementById("total").innerText = total;
    localStorage.setItem("laundry", JSON.stringify(data));
}

function tambah() {
    data.push({tanggal:"", nama:"", jumlah:1, check:false});
    render();
}

function update(i, field, value) {
    data[i][field] = value;
    render();
}

function hapusSemua() {
    if(confirm("Hapus semua data?")) {
        data = [];
        render();
    }
}

function hapusSelected() {
    data = data.filter(item => !item.check);
    render();
}

render();
</script>

</body>
</html>
